openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /auth/session:
    get:
      operationId: getFirebaseSession
      tags: [auth]
      security: [{ firebaseBearer: [] }]
      responses:
        "200":
          description: Verified Firebase account and stable marketplace identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirebaseSession"
        "401":
          description: Missing or invalid Firebase token
        "403":
          description: Email verification required
        "503":
          description: Account migration unavailable, retry without losing data
  /auth/google/handoff:
    post:
      operationId: createGoogleHandoff
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleHandoffInput"
      responses:
        "200":
          description: Encrypted proof-bound return URI for the native browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleHandoff"
        "400":
          description: Invalid parameters
        "401":
          description: Invalid Firebase Google identity
  /auth/google/redeem:
    post:
      operationId: redeemGoogleHandoff
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleRedemptionInput"
      responses:
        "200":
          description: Google credential recovered with the initiating device's proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCredential"
        "400":
          description: Invalid, expired or incorrectly bound handoff
  /listings:
    get:
      operationId: listListings
      tags: [listings]
      responses:
        "200":
          description: Public listings
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ListingRecord" }
    post:
      operationId: createListing
      tags: [listings]
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "201":
          description: Created or previously imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingRecord" }
  /listings/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      operationId: getListing
      tags: [listings]
      responses:
        "200":
          description: Listing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingRecord" }
    put:
      operationId: updateListing
      tags: [listings]
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingRecord" }
    delete:
      operationId: removeListing
      tags: [listings]
      security: [{ firebaseBearer: [] }]
      responses:
        "204": { description: Deleted }
  /storage/uploads/request-url:
    post:
      operationId: requestListingUpload
      tags: [storage]
      security: [{ firebaseBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ListingImageInput" }
      responses:
        "200":
          description: Direct upload URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListingImageUpload" }
  /storage/images/{id}:
    get:
      operationId: getListingImage
      tags: [storage]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Published image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    firebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    FirebaseSession:
      type: object
      required: [accountId, firebaseUid, email]
      properties:
        accountId: { type: string }
        firebaseUid: { type: string }
        email: { type: string }
    GoogleHandoffInput:
      type: object
      required: [firebaseIdToken, googleIdToken, codeChallenge, returnUrl, state]
      properties:
        firebaseIdToken: { type: string, maxLength: 16000 }
        googleIdToken: { type: string, maxLength: 16000 }
        codeChallenge: { type: string, pattern: "^[a-f0-9]{64}$" }
        state: { type: string, pattern: "^[a-f0-9]{64}$" }
        returnUrl: { type: string, maxLength: 2048 }
    GoogleHandoff:
      type: object
      required: [returnUrl]
      properties:
        returnUrl: { type: string }
    GoogleRedemptionInput:
      type: object
      required: [handoff, verifier, state]
      properties:
        handoff: { type: string, maxLength: 24000 }
        verifier: { type: string, pattern: "^[a-f0-9]{64}$" }
        state: { type: string, pattern: "^[a-f0-9]{64}$" }
    GoogleCredential:
      type: object
      required: [idToken]
      properties:
        idToken: { type: string }
    ListingInput:
      type: object
      additionalProperties: false
      required: [id, title, category, price, negotiable, images, breed, age, gender, weight, color, city, district, geo, description, phone, sellerName, delivery, vaccinated]
      properties:
        id: { type: string, minLength: 6, maxLength: 100, pattern: "^[a-zA-Z0-9_-]+$" }
        title: { type: string, minLength: 3, maxLength: 160 }
        category: { type: string, enum: [mushuk, kuchuk, qush, qoramol, ot, ekzotik] }
        price: { type: number, minimum: 1000, maximum: 999999999999 }
        negotiable: { type: boolean }
        images:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, pattern: "^/api/storage/images/[a-f0-9-]{36}$" }
        breed: { type: string, minLength: 1, maxLength: 160 }
        age: { type: string, minLength: 1, maxLength: 40 }
        gender: { type: string, enum: [erkak, urgochi, aralash, ""] }
        count: { type: integer, minimum: 1, maximum: 999 }
        documents: { type: string, maxLength: 160 }
        weight: { type: string, minLength: 1, maxLength: 40 }
        color: { type: string, minLength: 1, maxLength: 100 }
        city: { type: string, minLength: 1, maxLength: 100 }
        district: { type: string, minLength: 1, maxLength: 160 }
        geo: { $ref: "#/components/schemas/ListingLocation" }
        description: { type: string, minLength: 10, maxLength: 10000 }
        phone: { type: string, pattern: "^998[0-9]{9}$" }
        sellerName: { type: string, minLength: 1, maxLength: 160 }
        delivery: { type: boolean }
        vaccinated: { type: boolean }
    ListingLocation:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
    ListingRecord:
      allOf:
        - { $ref: "#/components/schemas/ListingInput" }
        - type: object
          required: [ownerId, createdAt, rating, views]
          properties:
            ownerId: { type: string }
            createdAt: { type: number }
            rating: { type: number }
            views: { type: number }
    ListingImageInput:
      type: object
      required: [contentType, size]
      properties:
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, image/heif] }
        size: { type: integer, minimum: 1, maximum: 10485760 }
    ListingImageUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

